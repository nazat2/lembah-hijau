<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07060f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
<meta name="apple-mobile-web-app-title" content="Lembah Hijau">
<meta name="description" content="Legenda Lembah Hijau v1 — RPG turn-based. Selamatkan lembah, pilih akhirmu.">
<title>Legenda Lembah Hijau</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--u:16px;--gold:#c9a24a;--panel:#121830;--panel2:#1b2442;--ink:#f2ead2;--dim:#9aa6c8;--ok:#7bff9a;--bad:#ff7a7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#07060f;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;font-family:"Courier New",Consolas,monospace;color:var(--ink)}
button{font-family:inherit;color:inherit}
#stage{position:fixed;inset:0;background:#07060f}
#game{position:absolute;left:0;top:0;background:#000;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;display:block}
.hide{display:none!important}

/* ---- kontrol sentuh ---- */
:root{--hs:1;--bs:1;--bo:.9}
#pad{position:absolute;inset:0;pointer-events:none;display:none}
body.touch[data-mode=world] #pad,body.touch[data-mode=edit] #pad{display:block}
.b{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;background:rgba(20,16,40,.55);border:2px solid rgba(255,255,255,.65);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:bold;text-shadow:0 1px 2px #000;user-select:none;opacity:var(--bo);scale:var(--bs);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);padding:0}
.b.on{background:rgba(255,217,74,.6);transform:scale(.92);border-color:#ffe9a8}
#bA{right:max(16px,4vw);bottom:max(20px,13vh);width:max(72px,18vh);height:max(72px,18vh);font-size:max(24px,5.5vh);background:rgba(60,160,80,.55)}
.b i{font-style:normal;line-height:1}.b span{font-size:.3em;letter-spacing:.04em;line-height:1;margin-top:.15em}.b{flex-direction:column}
.b.sm{width:max(52px,11vh);height:max(52px,11vh);font-size:max(18px,4vh);border-radius:14px}.b.sm span{font-size:max(9px,1.9vh);font-weight:700}
#bA span{font-size:max(10px,2.2vh);font-weight:700}
#bMenu{right:max(8px,1.6vw);top:max(8px,2vh)}
#bQuest{right:calc(max(8px,1.6vw) + (max(52px,11vh) + 8px));top:max(8px,2vh)}
#bMap{right:calc(max(8px,1.6vw) + (max(52px,11vh) + 8px) * 2);top:max(8px,2vh)}
#bBag{right:calc(max(8px,1.6vw) + (max(52px,11vh) + 8px) * 3);top:max(8px,2vh)}
#bFs{right:calc(max(8px,1.6vw) + (max(52px,11vh) + 8px) * 4);top:max(8px,2vh)}
#joyFix{position:absolute;left:max(24px,5vw);bottom:max(24px,14vh);width:110px;height:110px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(20,16,40,.3);pointer-events:none;display:none;opacity:var(--bo);scale:var(--bs)}
#joyFix::after{content:"";position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.6)}
body.joyfix[data-mode=world] #joyFix,body.joyfix[data-mode=edit] #joyFix{display:block}
#joyBase,#joyKnob{position:absolute;border-radius:50%;pointer-events:none;display:none}
#joyBase{width:108px;height:108px;border:2px solid rgba(255,255,255,.45);background:rgba(20,16,40,.28)}
#joyKnob{width:44px;height:44px;background:rgba(255,255,255,.55);border:2px solid rgba(255,255,255,.85)}
body.editing .b,body.editing #joyFix,body.editing #hudL,body.editing #hParty,body.editing #trk{pointer-events:auto!important;outline:2px dashed var(--gold);outline-offset:3px;cursor:grab;touch-action:none}
body.editing .drag{outline-color:#fff;cursor:grabbing;z-index:9}
body.editing #hud{opacity:1!important}
#rot{position:fixed;inset:0;z-index:30;background:#07060f;color:#ffe9a8;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px;font-weight:bold;font-size:18px}
#rot .ic{font-size:56px}
#err{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#600;color:#fff;font:12px monospace;padding:6px 10px;display:none}

/* ---- lapisan UI (sama ukuran dengan kanvas) ---- */
#ui{position:fixed;font-size:var(--u);pointer-events:none;overflow:hidden;z-index:5}
#ui>*{pointer-events:none}
.btn{pointer-events:auto;background:var(--panel2);border:2px solid #3a4670;color:var(--ink);padding:.45em .7em;border-radius:.4em;font-size:1em;text-align:left;cursor:pointer;min-height:2.6em;display:flex;flex-direction:column;justify-content:center;gap:.1em;touch-action:manipulation}
.btn:hover{border-color:#8fa4e8}
.btn:focus-visible,.btn:focus{outline:none;border-color:var(--gold);background:#27345e;box-shadow:0 0 0 2px rgba(201,162,74,.5)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.4;cursor:default}
.btn .l{font-weight:bold;line-height:1.15}.btn .s{font-size:.78em;color:var(--dim);line-height:1.15}.btn .pr{font-size:.85em;color:#ffd84a;font-weight:bold}
.btn.on{border-color:var(--gold);background:#2d3a68}
.btn.back{background:#2a1f2a;border-color:#6a4a5a;justify-content:center;text-align:center}
.btn.x{min-height:0;padding:.2em .6em;font-weight:bold;justify-content:center}
.btn.tab{min-height:0;padding:.35em .7em;justify-content:center;text-align:center;font-weight:bold}
.btn.tab.on{background:var(--gold);color:#1a1408;border-color:#ffe9a8}
.el{display:inline-block;width:1.15em;height:1.15em;line-height:1.15em;text-align:center;border-radius:.25em;color:#000;font-style:normal;font-size:.8em;font-weight:bold;margin-right:.35em}
.ult{color:#ffd84a}

.bar{height:.5em;background:#0c0f1c;border:1px solid #000;border-radius:.2em;overflow:hidden;margin:.12em 0}
.bar i{display:block;height:100%;background:#4a8;transition:width .25s}
.bar.hp i{background:linear-gradient(#7be07b,#2f9a3f)}.bar.mp i{background:linear-gradient(#7ab4ff,#2a5fcf)}.bar.ult i{background:linear-gradient(#ffe27a,#e08a1a)}.bar.ult.full{box-shadow:0 0 .5em #ffd84a}.bar.xp i{background:#b070ff}.bar.fr i{background:#ff7aa8}
.bar .plotbar i{background:#7be07b}

/* ---- HUD ---- */
#hud{position:absolute;inset:0}
body:not([data-mode=world]):not([data-mode=edit]) #hud{opacity:0}
#hudL,#hParty,#trk{scale:var(--hs);transform-origin:top left}
#trk{transform-origin:top center}
#hudL{position:absolute;left:.6em;top:.5em;display:flex;gap:.8em;background:rgba(10,12,30,.7);border:1px solid #3a4670;border-radius:.4em;padding:.3em .6em;font-size:.9em;font-weight:bold}
#hParty{position:absolute;left:.6em;top:2.8em;display:flex;gap:.4em}
.mini{width:5.2em;font-size:.72em;background:rgba(10,12,30,.7);border:1px solid #3a4670;border-radius:.3em;padding:.2em .4em}
#trk{position:absolute;left:50%;transform:translateX(-50%);top:.5em;max-width:44%;min-width:16em;background:rgba(10,12,30,.78);border:1px solid var(--gold);border-radius:.4em;padding:.3em .7em;font-size:.82em}
#trkT{color:var(--gold);font-weight:bold}#trkS{line-height:1.2}
#trkW{font-size:.82em;color:#9fb4d8;margin-top:.1em}
#hot{position:absolute;right:.6em;bottom:.6em;display:flex;gap:.35em;pointer-events:auto}body:not([data-mode=world]) #hot{pointer-events:none}body.touch #hot,body.editing #hot{display:none}
.chip{font:inherit;font-size:.78em;display:flex;align-items:center;gap:.4em;padding:.3em .6em;border-radius:.5em;background:rgba(10,12,30,.7);border:1px solid rgba(255,255,255,.28);color:#fff;cursor:pointer;backdrop-filter:blur(3px)}.chip:hover{border-color:var(--gold);background:rgba(40,36,80,.85)}.chip i{font-style:normal}.chip kbd{font:inherit;font-size:.8em;padding:0 .35em;border-radius:.25em;background:rgba(255,255,255,.16);color:#ffe9a8}
#trkD{display:flex;align-items:center;gap:.5em;color:#cfe4ff;margin-top:.15em}#trkA{display:inline-block;font-style:normal;color:#ffd84a;font-size:1.4em;line-height:1;transition:transform .15s}
#prompt{position:absolute;left:50%;transform:translateX(-50%);bottom:12%;background:rgba(10,12,30,.82);border:2px solid var(--gold);border-radius:.5em;padding:.35em .9em;font-weight:bold;white-space:nowrap}
#banner{position:absolute;left:0;right:0;top:20%;text-align:center;font-size:2em;font-weight:bold;color:#ffe9a8;text-shadow:0 2px 6px #000;opacity:0}
#banner.show{animation:ban 2.6s ease both}@keyframes ban{0%{opacity:0;transform:translateY(-.5em)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
#toasts{position:absolute;left:50%;transform:translateX(-50%);top:5.5em;display:flex;flex-direction:column;gap:.3em;align-items:center;width:70%}
.toast{background:rgba(10,12,30,.88);border:1px solid var(--gold);border-radius:.4em;padding:.3em .8em;font-size:.88em;text-align:center;animation:tin .25s ease both}.toast.out{opacity:0;transition:opacity .4s}@keyframes tin{from{opacity:0;transform:translateY(-.4em)}}
body[data-mode=battle] #trk,body[data-mode=battle] #hudL,body[data-mode=battle] #hParty{display:none}
body[data-mode=battle] #toasts{top:2.6em}

/* ---- dialog ---- */
#dlg{position:absolute;left:3%;right:3%;bottom:3%;pointer-events:auto;background:rgba(14,18,40,.95);border:3px solid var(--gold);border-radius:.6em;padding:.7em .9em .8em 6.6em;min-height:6.4em;cursor:pointer}
#dlg.nar{padding-left:.9em;border-color:#6a7ab0;font-style:italic}
#dlgPort{position:absolute;left:.7em;top:.7em;width:5.2em;height:5.2em;background:#0a0d1e;border:2px solid #3a4670;border-radius:.4em;image-rendering:pixelated}
#dlg.nar #dlgPort{display:none}
#dlgName{color:var(--gold);font-weight:bold;margin-bottom:.2em}
#dlgTxt{line-height:1.35;font-size:1.05em;min-height:2.7em}
#dlgHint{position:absolute;right:.8em;bottom:.4em;color:var(--gold);animation:blink 1s infinite}@keyframes blink{50%{opacity:.2}}
#dlgCh{position:absolute;right:0;bottom:calc(100% + .4em);display:flex;flex-direction:column;gap:.3em;max-width:80%;align-items:stretch}
#dlgCh .btn{background:#1a2750;border-color:var(--gold)}

/* ---- panel menu ---- */
#menu{position:absolute;inset:0;z-index:20;background:rgba(4,6,16,.72);pointer-events:auto;display:flex;align-items:center;justify-content:center}
.panel{background:var(--panel);border:3px solid var(--gold);border-radius:.6em;display:flex;flex-direction:column;max-height:96%;width:min(34em,92%);box-shadow:0 8px 40px #000}
.panel.big{width:97%;height:96%}.panel.small{width:min(30em,92%)}
.ph{display:flex;justify-content:space-between;align-items:center;padding:.4em .7em;border-bottom:2px solid #2a3560;gap:.5em}.ph h3{margin:0;font-size:1em;color:var(--gold)}
.tabs{display:flex;gap:.3em;padding:.4em .6em;overflow-x:auto;border-bottom:1px solid #2a3560;flex:none;touch-action:pan-x}
.pb{padding:.6em .8em;overflow-y:auto;overflow-x:hidden;flex:1;touch-action:pan-y;-webkit-overflow-scrolling:touch;min-height:0}
.pb h4{margin:.8em 0 .3em;color:var(--gold);font-size:.95em}.pb h3{margin:.2em 0;color:var(--ink)}
.txt{line-height:1.35;margin:.4em 0}.txt.small,small{font-size:.8em;color:var(--dim)}
.note{min-height:1.3em;margin:.2em 0;color:var(--ok);font-size:.9em}.note.bad{color:var(--bad)}
.col{display:flex;flex-direction:column;gap:.35em}.row{display:flex;gap:.4em;margin:.4em 0}.row.wrap{flex-wrap:wrap}.row>.btn{flex:1}
.list{display:flex;flex-direction:column;gap:.3em}
.row2{display:grid!important;grid-template-columns:1fr auto;column-gap:.6em;align-items:center}.row2 .s{grid-column:1}.row2 .pr{grid-row:1/3;grid-column:2;text-align:right}
.bar2{display:flex;justify-content:space-between;gap:.6em;flex-wrap:wrap;background:#0c1126;border:1px solid #2a3560;border-radius:.3em;padding:.3em .6em;font-size:.85em}
.sep{height:1px;background:#2a3560;margin:.6em 0}.ok{color:var(--ok)}.no{color:var(--bad)}
.split{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:.8em}.lst{display:flex;flex-direction:column;gap:.3em}.lst h4{margin:.3em 0 0}
.btn.q.done{opacity:.6}.steps{padding-left:1.4em;margin:.4em 0}.steps li{margin:.25em 0}.steps li.ok{color:var(--ok);text-decoration:line-through;opacity:.7}.steps li.cur{color:#ffd84a;font-weight:bold}.steps li.todo{color:var(--dim)}
.guide{background:#0c1126;border:1px solid var(--gold);border-radius:.3em;padding:.4em .6em}.lore{margin:.35em 0;font-size:.88em}.lore b{color:var(--gold)}
#mapC{width:100%;max-height:48vh;image-rendering:pixelated;border:2px solid #2a3560;border-radius:.3em;background:#000;display:block;object-fit:contain}
.legend{display:flex;gap:1em;font-size:.8em;margin:.3em 0;flex-wrap:wrap}.dot{display:inline-block;width:.8em;height:.8em;border-radius:50%;margin-right:.3em;vertical-align:middle}.dot.p{background:#4aa8ff}.dot.q{background:#ffd84a}.dot.n{background:#7bff9a}.dot.w{background:#6ab0ff;border-radius:0}
.cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(14em,1fr));gap:.6em}.pcard{background:#0e1428;border:1px solid #2a3560;border-radius:.4em;padding:.5em .7em}.pcard h4{margin:0 0 .2em}
.stats{display:flex;flex-wrap:wrap;gap:.2em .8em;font-size:.85em;margin:.3em 0}.stats b{color:#ffd84a}.stats.big{font-size:1em;background:#0c1126;border-radius:.3em;padding:.4em .6em}
.frl{display:flex;flex-direction:column;gap:.2em}.frr{display:grid;grid-template-columns:8em 1fr auto 5em;gap:.5em;font-size:.88em;align-items:center}.hearts{color:#ff7aa8}.frr em{color:var(--dim);font-style:normal}
.chips{display:flex;flex-wrap:wrap;gap:.3em}.chip{background:#0e1428;border:1px solid #2a3560;border-radius:.8em;padding:.15em .6em;font-size:.82em}
.biz{background:#0e1428;border:1px solid #2a3560;border-radius:.4em;padding:.5em .7em}.sl{display:flex;flex-direction:column;gap:.2em;font-size:.9em;pointer-events:auto}.sl input{width:100%;height:2em;pointer-events:auto;touch-action:pan-x}
.plots{display:grid;grid-template-columns:repeat(4,1fr);gap:.4em;margin:.4em 0}.plot{align-items:stretch;text-align:center;min-height:4.4em}.plot.ready{border-color:#ffd84a;background:#3a3a1a}.plot.sel{border-color:#fff}.plot.lock{opacity:.3}
.npcbox{display:flex;gap:.8em;align-items:center}#npcPort{width:5em;height:5em;background:#0a0d1e;border:2px solid #3a4670;border-radius:.4em;image-rendering:pixelated}.role{color:var(--gold);font-weight:bold}.fr{margin-top:.2em}
h2.end{color:var(--gold);text-align:center;margin:.3em 0}

/* ---- battle ---- */
#bt{position:absolute;inset:0}#bt>*{pointer-events:none}
/* slot save */
.slots .slot{display:flex;gap:.4em;align-items:stretch}.slots .slot .btn:first-child{flex:1;text-align:left}.slots .slot .btn.ghost{flex:0 0 3em}
#btTools{position:absolute;right:.6em;top:.5em;display:flex;gap:.35em;pointer-events:auto!important;z-index:4}#btTools .chip.on{border-color:var(--gold);background:rgba(120,90,20,.8);color:#ffe9a8}
#btOrder{position:absolute;left:.6em;top:.5em;display:flex;gap:.25em}
.oc{min-width:2em;height:2em;line-height:2em;text-align:center;font-size:.8em;font-weight:bold;border-radius:.3em;border:2px solid #000;padding:0 .2em}
.oc.p{background:#3a78d8}.oc.e{background:#c04848}.oc.cur{border-color:#ffd84a;transform:scale(1.18);box-shadow:0 0 .6em #ffd84a}
#btMsg{position:absolute;left:50%;transform:translateX(-50%);top:.5em;background:rgba(10,12,30,.85);border:2px solid var(--gold);border-radius:.4em;padding:.35em .9em;font-weight:bold;opacity:0;transition:opacity .2s;max-width:60%;text-align:center}#btMsg.show{opacity:1}
#btBottom{position:absolute;left:0;right:0;bottom:0;height:38%;display:flex;gap:.5em;padding:.5em;background:linear-gradient(transparent,rgba(5,6,18,.92) 20%)}
#btParty{flex:1.2;display:flex;flex-direction:column;min-width:0}.sync{display:flex;align-items:center;gap:.5em;font-size:.72em;font-weight:bold;color:#ffd84a;margin-bottom:.2em}.sync .bar{flex:1;margin:0}.sync .bar i{background:linear-gradient(#ffb86a,#e0622a)}
.cards{display:flex;gap:.4em;flex:1;min-height:0}.card{flex:1;min-width:0;background:rgba(14,20,44,.92);border:2px solid #2a3560;border-radius:.4em;padding:.3em .45em;font-size:.82em;overflow:hidden}.card.act{border-color:#ffd84a;box-shadow:0 0 .6em rgba(255,216,74,.6)}.card.ko{opacity:.45}.card.guest{flex:.7;border-color:#7ac0ff}.card b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card small{font-size:.8em;display:block}
.sts{display:flex;flex-wrap:wrap;gap:.15em}.sts em{font-style:normal;font-size:.7em;color:#000;border-radius:.2em;padding:0 .3em;font-weight:bold}
#btCmd{flex:1;min-width:0;display:flex;flex-direction:column;gap:.25em;background:rgba(14,20,44,.92);border:2px solid var(--gold);border-radius:.5em;padding:.4em;pointer-events:auto;overflow:hidden}
#btCmd:empty{visibility:hidden}.ctitle{font-size:.82em;color:var(--gold)}.clist{display:flex;flex-direction:column;gap:.25em;overflow-y:auto;flex:1;min-height:0;touch-action:pan-y}
#btCmd.grid3 .clist{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:.3em}#btCmd.grid3 .btn{text-align:center;align-items:center;padding:.3em}
#btCmd .btn{min-height:2.2em;padding:.25em .5em}.empty{font-size:.8em;color:var(--dim);padding:.4em}
#btRes{position:absolute;inset:0;z-index:15;background:rgba(4,6,16,.7);display:flex;align-items:center;justify-content:center;pointer-events:auto}.rbox{background:var(--panel);border:3px solid var(--gold);border-radius:.6em;padding:.8em 1em;width:min(30em,90%);max-height:94%;overflow:auto}.rbox h2{margin:0 0 .4em;text-align:center;color:var(--gold)}
.rrow{display:flex;justify-content:space-between;gap:.6em;border-bottom:1px solid #2a3560;padding:.25em 0;font-size:.92em}.up{color:#ffd84a;margin:.3em 0;font-weight:bold}.rbtn{display:flex;gap:.5em;margin-top:.6em}.rbtn .btn{flex:1;justify-content:center;text-align:center}

/* ---- judul ---- */
#title{position:absolute;inset:0;z-index:10;pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6em;background:radial-gradient(circle at 50% 40%,rgba(10,30,20,.5),rgba(4,6,16,.88))}
#title h1{margin:0;font-size:2.6em;color:#ffe9a8;text-shadow:0 3px 0 #5a3a10,0 0 20px #3a8a40;text-align:center;line-height:1.05}#title h1 small{display:block;font-size:.36em;color:#9fe6a8;letter-spacing:.3em;margin-top:.4em}
#title .menu{display:flex;flex-direction:column;gap:.4em;width:min(17em,80%)}#title .btn{justify-content:center;text-align:center;font-weight:bold;min-height:2.8em}#title p{margin:.2em;font-size:.78em;color:var(--dim);text-align:center}

/* ---- v2: pilihan awal, editor, cutscene, pengaturan ---- */
.picks{display:flex;gap:.8em;justify-content:center;flex-wrap:wrap;width:96%;pointer-events:auto}
.pick{pointer-events:auto;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:.25em;width:min(15em,44%);padding:.8em .7em;background:linear-gradient(#1b2442,#121830);border:2px solid #3a4670;border-radius:.7em;color:var(--ink);text-align:center;transition:transform .15s,border-color .15s,box-shadow .15s;touch-action:manipulation}
.pick:hover{border-color:#8fa4e8;transform:translateY(-2px)}
.pick.rec{border-color:var(--gold);box-shadow:0 0 1.2em rgba(201,162,74,.35)}
.pick:focus-visible{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,74,.55)}
.pick i{font-style:normal;font-size:2.4em;line-height:1}.pick b{font-size:1.15em;color:#ffe9a8}.pick span{font-size:.78em;color:var(--dim);line-height:1.3}.pick small{color:#9fe6a8;font-size:.8em}
.pick em{position:absolute;top:-.7em;right:.6em;background:var(--gold);color:#1a1408;font-style:normal;font-size:.68em;font-weight:bold;padding:.1em .6em;border-radius:1em}
.pick canvas{width:6.4em;height:6.4em;image-rendering:pixelated;background:radial-gradient(circle,#26335e,#0a0d1e);border-radius:50%;border:2px solid #3a4670}
.pick.hero.rec canvas{border-color:var(--gold)}
.mini2{pointer-events:auto;min-height:0;padding:.3em .9em;text-align:center;align-items:center}
#title .menu .btn.ghost{background:transparent;border-color:#3a4670;color:var(--dim);font-weight:normal;min-height:2.3em}
#tFs{position:absolute;right:.8em;top:.7em;pointer-events:auto;min-height:0;width:2.4em;height:2.4em;padding:0;align-items:center;font-size:1.1em}
.seg{display:flex;gap:.4em}.seg .btn{flex:1;text-align:center;align-items:center}
.sl span{display:flex;justify-content:space-between}.sl b{color:var(--gold)}
#editBar{position:absolute;left:50%;transform:translateX(-50%);bottom:.8em;width:min(34em,94%);background:rgba(10,12,30,.94);border:2px solid var(--gold);border-radius:.6em;padding:.5em .7em;pointer-events:auto!important;display:flex;flex-direction:column;gap:.35em;z-index:20}
#editBar *{pointer-events:auto}
#edHint{font-weight:bold;color:var(--gold);font-size:.9em}
.edr{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:.4em}
.edr label{font-size:.75em;color:var(--dim);display:flex;flex-direction:column}.edr input{width:100%;height:1.8em;touch-action:pan-x}
.edb{display:flex;gap:.4em}.edb .btn{flex:1;justify-content:center;text-align:center;min-height:2.2em}
#cut{position:absolute;inset:0;pointer-events:none;z-index:4}
#cutBar{position:absolute;right:.8em;top:.6em;display:flex;gap:.4em;z-index:6;pointer-events:none}#cutBar .btn{pointer-events:auto}#cutBar .btn.on{background:var(--gold);color:#111}#dlgAuto{position:absolute;right:.5em;top:.4em;min-height:0;padding:.1em .6em;font-size:.7em;pointer-events:auto}#dlgAuto.on{background:var(--gold);color:#111}body.cutting #dlgAuto{display:none}#chap{position:absolute;left:0;right:0;top:26%;padding:1.2em 0;background:linear-gradient(90deg,transparent,rgba(5,8,24,.78) 20%,rgba(5,8,24,.78) 80%,transparent);text-align:center;pointer-events:none;opacity:0;z-index:7;text-shadow:0 2px 6px #000;transition:opacity .8s}#chap.show{opacity:1}#chap small{display:block;letter-spacing:.3em;color:var(--gold);font-size:.9em}#chap b{display:block;font-size:2em;margin:.1em 0}#chap i{display:block;font-style:normal;opacity:.85;font-size:.9em}
#cutSkip{pointer-events:auto;min-height:0;padding:.3em .9em;background:rgba(10,12,30,.72);border-color:rgba(255,255,255,.4);font-size:.85em;z-index:6;align-items:center}
#cutTitle{position:absolute;left:0;right:0;top:38%;text-align:center;opacity:0;display:flex;flex-direction:column;align-items:center;gap:.4em}
#cutTitle small{letter-spacing:.5em;color:#9fe6a8;font-size:.9em}
#cutTitle b{font-size:2.6em;letter-spacing:.12em;color:#ffe9a8;text-shadow:0 0 .6em rgba(110,255,170,.6),0 3px 0 #3a2a08;white-space:nowrap}
#cutTitle i{display:block;height:2px;width:0;background:linear-gradient(90deg,transparent,#ffe9a8,transparent)}
#cutTitle.show{animation:ctin 4s ease both}#cutTitle.show i{animation:ctl 4s ease both}
@keyframes ctin{0%{opacity:0;letter-spacing:.5em;filter:blur(6px)}18%{opacity:1;filter:none}80%{opacity:1}100%{opacity:0}}
@keyframes ctl{0%{width:0}25%{width:60%}85%{width:60%}100%{width:0}}
body.cutting #dlg{bottom:12%}
input[type=range]{accent-color:var(--gold)}
body.touch #trk{left:.6em;transform:none;top:7em;min-width:11em;max-width:40%;font-size:.74em}
body.touch #toasts{top:9em}
body.cutting #hud,body.cutting #prompt,body.cutting #toasts{opacity:0}
@media (max-width:700px){#cutTitle b{font-size:1.8em}}
@media (max-height:420px){.panel.small{max-height:98%}}
</style>
</head>

  <div id="chap"></div><div id="dlg" class="hide"><canvas id="dlgPort" width="64" height="64"></canvas><div id="dlgName"></div><div id="dlgTxt"></div><div id="dlgHint" class="hide">▼</div><button id="dlgAuto" class="btn" type="button">Auto</button><div id="dlgCh"></div></div>

  <div id="editBar" class="hide"><div id="edHint"></div><div class="edr"><label>Ukuran HUD<input type="range" id="edHs" min="70" max="140"></label><label id="edBsW">Ukuran tombol<input type="range" id="edBs" min="70" max="150"></label><label id="edBoW">Transparansi<input type="range" id="edBo" min="30" max="100"></label></div><div class="edb"><button class="btn" id="edReset" type="button">Reset</button><button class="btn" id="edDone" type="button">Selesai</button></div></div>
